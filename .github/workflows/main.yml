steps
- name: Checkout code
  uses: actions/checkout@v3

- name: Set up JDK 17
  uses: actions/setup-java@v3
  with:
    distribution: 'temurin'
    java-version: '17'

- name: Setup Android SDK
  uses: android-actions/setup-android@v2

- name: Create minimal project
  run: |
    mkdir -p app/src/main/java/com/blackbox/osint
    mkdir -p app/src/main/res/values
    echo 'package com.blackbox.osint; import android.app.Activity; import android.os.Bundle; import android.widget.TextView; public class MainActivity extends Activity { @Override protected void onCreate(Bundle savedInstanceState) { super.onCreate(savedInstanceState); TextView tv = new TextView(this); tv.setText("Blackbox OSINT Pro"); setContentView(tv); } }' > app/src/main/java/com/blackbox/osint/MainActivity.java
    echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.blackbox.osint"><application android:label="Blackbox OSINT"><activity android:name=".MainActivity"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
    echo 'apply plugin: "com.android.application"' > app/build.gradle
    echo 'android { compileSdk 34 defaultConfig { applicationId "com.blackbox.osint" minSdk 24 targetSdk 34 } }' >> app/build.gradle
    echo 'rootProject.name = "myapp" include ":app"' > settings.gradle
    mkdir -p gradle/wrapper
    echo 'distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip' > gradle/wrapper/gradle-wrapper.properties
    echo '#!/bin/sh' > gradlew
    echo 'exec java -jar gradle-wrapper.jar "$@"' >> gradlew
    chmod +x gradlew

- name: Build APK
  run: |
    ./gradlew assembleDebug --no-daemon

- name: Upload APK
  uses: actions/upload-artifact@v3
  with:
    name: app-debug
    path: app/build/outputs/apk/debug/*.apk
