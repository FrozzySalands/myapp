name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Set up JDK
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build APK
      run: |
        mkdir -p app/src/main
        echo "package com.blackbox.osint;" > app/src/main/java/MainActivity.java
        echo "class MainActivity {}" >> app/src/main/java/MainActivity.java
        echo "apply plugin: 'com.android.application'" > app/build.gradle
        echo "android { compileSdk 34 }" >> app/build.gradle

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk
